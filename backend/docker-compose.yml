# Stack completa (espelha o doc §12.3). Real-time/filas presentes mas com
# uso adiado: web/db bastam para a Fundação (auth + projeto). redis/celery/
# channels entram em ação quando Presença e Planning Poker forem implementados.
services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: t4e
      POSTGRES_PASSWORD: t4e
      POSTGRES_DB: t4e_office
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # SFU das reuniões. Um SFU recebe um stream de cada participante e o
  # redistribui, em vez de cada um enviar para todos (mesh) — é o que permite
  # sala de 20+ sem estourar o upload de quem fala. Self-hosted: sem custo por
  # minuto e sem dependência de terceiro em runtime.
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"      # API/WebSocket de sinalização
      - "7881:7881"      # WebRTC sobre TCP (fallback de firewall)
      - "50000-50100:50000-50100/udp"  # mídia RTP
    depends_on:
      - redis

  # Worker de filas — uso adiado (métricas/automações). Mantido pronto.
  celery:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    profiles: ["workers"]

volumes:
  pgdata:
