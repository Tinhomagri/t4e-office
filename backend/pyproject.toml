[project]
name = "t4e-office-backend"
version = "0.1.0"
description = "T4E Office (Pulse) — backend Django + DDD"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    # Infra real-time/filas: presente no ambiente, uso adiado para Presença/Poker
    "celery>=5.4",
    "redis>=5.0",
    "channels>=4.1",
    # Copiloto IA: Claude + OpenAI + extração de documentos
    "anthropic>=0.40",
    "openai>=1.40",
    "pypdf>=5.0",
    "python-docx>=1.1",
    # Integração Google (OAuth + Calendar) e cifragem de tokens
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "cryptography>=43.0",
    # PDF das propostas comerciais. ReportLab é Python puro de propósito: o
    # backend roda serverless na Vercel (api/index.py + @vercel/python) e
    # WeasyPrint exigiria pango/cairo como lib de sistema, impossível ali.
    "reportlab>=4.2",
    # Áudio (opcional): faster-whisper + ffmpeg habilitam transcrição
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
# Migrations são geradas pelo Django — não lintar estilo de código gerado.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    # `str, Enum` é padrão deliberado (enum serializável em JSON) — não migrar p/ StrEnum.
    "UP042",
    # __str__ opcional em models auxiliares (M2M/log/token) que nunca aparecem sozinhos no admin.
    "DJ008",
    # Comprimento de linha: URLconf e choices densos ficam mais legíveis em uma linha.
    "E501",
    # PokerVote.value usa null=True de propósito: None = "ainda não votou" (≠ string vazia).
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
# Testes podem ter linhas longas em fixtures/asserts.
"*/tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = []
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--tb=short"
